[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-translator"
version = "1.0.0"
description = "Translate CUDA binaries (PTX/fatbin/cubin/PE) into portable OpenCL C and inspection artifacts, with CLI, REST API, and MCP server."
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
cuda-translator = "cuda_translator.cli:main"

[tool.setuptools]
packages = ["cuda_translator"]
