name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-tree:
    name: source-tree / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit/regression suite
        run: python -m unittest discover -s tests -p "test*.py" -v
      - name: Reproducible public stress fixture
        run: python tools/gen_public_stress.py --check
      - name: Translate public stress fixture
        run: |
          python cuda-translator.py analyze examples/artifacts/public_stress_sm52.ptx >/tmp/public-stress-analyze.json
          python cuda-translator.py translate examples/artifacts/public_stress_sm52.ptx -o /tmp/public-stress-opencl
      - name: Hardware seam (PASS or honest NO-DEVICE)
        shell: bash
        run: |
          set +e
          python scripts/verify_public_stress.py
          rc=$?
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 3 ]]; then
            exit "$rc"
          fi
          echo "hardware seam exit=$rc (0=PASS, 3=NO-DEVICE)"

  fresh-install:
    name: fresh installed package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from repository
        run: python -m pip install .
      - name: Console entrypoint and package resource
        shell: bash
        run: |
          cuda-translator --help
          cd /tmp
          python - <<'PY'
          from importlib import resources
          import cuda_translator
          data = resources.files("cuda_translator").joinpath("fixtures", "vector_add_sm75.ptx").read_bytes()
          open("/tmp/vector_add.ptx", "wb").write(data)
          atomic = b""".version 7.8
          .target sm_52
          .address_size 64
          .visible .entry atomic_test(.param .u64 p)
          {
          .reg .b64 %rd<3>;
          .reg .b32 %r<3>;
          ld.param.u64 %rd1, [p];
          cvta.to.global.u64 %rd2, %rd1;
          atom.global.add.u32 %r1, [%rd2], 1;
          ret;
          }
          """
          open("/tmp/atomic.ptx", "wb").write(atomic)
          print(cuda_translator.__file__)
          PY
          cuda-translator analyze /tmp/vector_add.ptx >/tmp/analyze.json
          cuda-translator translate /tmp/vector_add.ptx -o /tmp/opencl
          set +e
          cuda-translator translate /tmp/atomic.ptx >/tmp/atomic-result.json
          rc=$?
          set -e
          test "$rc" -eq 2
      - name: MCP smoke outside checkout
        run: cd /tmp && python "$GITHUB_WORKSPACE/tests/smoke_mcp.py"
      - name: REST smoke outside checkout
        run: cd /tmp && python "$GITHUB_WORKSPACE/tests/smoke_rest.py"
